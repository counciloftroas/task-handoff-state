name: no-claude-coauthor

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  no-claude-coauthor:
    name: no-claude-coauthor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject Claude and Anthropic attribution
        shell: bash
        env:
          # Pass the body as data. Do not interpolate it into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          trap 'rc=$?; rm -rf "$work"; exit "$rc"' EXIT
          report="${work}/report"
          : > "${report}"

          if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "BASE_SHA and HEAD_SHA must be set to the pull request base and head." >&2
            exit 1
          fi

          ensure_commit() {
            local sha="$1"
            local label="$2"
            if git cat-file -e "${sha}^{commit}" >/dev/null 2>&1; then
              return 0
            fi
            echo "Fetching ${label} commit ${sha}"
            git fetch --no-tags origin "${sha}"
            git cat-file -e "${sha}^{commit}" >/dev/null
          }

          ensure_commit "${BASE_SHA}" "base"
          ensure_commit "${HEAD_SHA}" "head"

          # Case-insensitive line match:
          #   Co-authored-by: ...claude... or ...anthropic...
          #   Generated with Claude Code
          #   Generated with [Claude Code]
          line_forbidden() {
            local line="$1"
            local lower
            lower="$(printf '%s' "${line}" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
            if printf '%s\n' "${lower}" | LC_ALL=C grep -Eq -- '^[[:space:]]*co-authored-by:.*(claude|anthropic)'; then
              return 0
            fi
            if printf '%s\n' "${lower}" | LC_ALL=C grep -Eq -- 'generated[[:space:]]+with[[:space:]]+\[?claude[[:space:]]+code\]?([^[:alnum:]]|$)'; then
              return 0
            fi
            return 1
          }

          fail=0

          check_text() {
            local heading="$1"
            local text="$2"
            local line
            local found=0
            local section="${work}/section"
            : > "${section}"
            while IFS= read -r line || [[ -n "${line}" ]]; do
              line="${line%$'\r'}"
              if line_forbidden "${line}"; then
                printf '  %s\n' "${line}" >> "${section}"
                found=1
              fi
            done <<< "${text}"
            if [[ "${found}" -eq 1 ]]; then
              fail=1
              {
                printf '\n%s\n' "${heading}"
                cat "${section}"
              } >> "${report}"
            fi
          }

          # Checkout on pull_request leaves HEAD on the synthetic merge commit.
          # Two-dot base..head is every commit the PR introduces.
          commits="$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")"
          if [[ -n "${commits}" ]]; then
            while IFS= read -r sha; do
              [[ -z "${sha}" ]] && continue
              subject="$(git log -1 --format=%s "${sha}")"
              message="$(git log -1 --format=%B "${sha}")"
              check_text "Commit ${sha} (${subject})" "${message}"
            done <<< "${commits}"
          fi

          check_text "Pull request description" "${PR_BODY-}"

          if [[ "${fail}" -ne 0 ]]; then
            echo "Claude/Anthropic attribution is not allowed in this pull request."
            echo "Matched lines:"
            cat "${report}"
            cat <<'EOF'

          How to fix:
            Delete the matched lines from the pull request description.
            For the flagged commits, reword the messages so those lines are gone, then force-push:
              git rebase -i <base>
              # mark each flagged commit as reword, delete the matched lines, then save
              git push --force-with-lease
          EOF
            exit 1
          fi

          echo "No Claude/Anthropic co-author or Claude Code attribution lines found."
